services:
  db:
    image: pgvector/pgvector:pg16
    container_name: edukonic_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edukonic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edukonic}
      POSTGRES_DB: ${POSTGRES_DB:-edukonic}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - edukonic_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edukonic} -d ${POSTGRES_DB:-edukonic}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  edukonic_pgdata:
